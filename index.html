
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>

*{
   margin:0;
   padding:0;
   box-sizing:border-box;
   font-family:Arial,sans-serif;
}

body{
   background:linear-gradient(135deg,#ff5f8f,#ff8fb1,#ffd6e0);
   height:100vh;
   display:flex;
   justify-content:center;
   align-items:center;
   overflow:hidden;
}

<audio id="bgMusic" loop>
    <source src="your-song.mp3" type="audio/mpeg">
</audio>

.container{
   width:90%;
   max-width:650px;
   background:white;
   border-radius:25px;
   padding:40px;
   text-align:center;
   box-shadow:0 15px 40px rgba(0,0,0,.2);
   position:relative;
}

h1{
   color:#ff2d75;
   margin-bottom:20px;
}

.message{
   font-size:24px;
   min-height:160px;
   display:flex;
   justify-content:center;
   align-items:center;
   color:#444;
   transition:0.4s;
}

button{
   padding:14px 35px;
   border:none;
   border-radius:40px;
   font-size:18px;
   cursor:pointer;
   background:#ff2d75;
   color:white;
}

button:hover{
   background:#ff0d63;
}

.heart{
   position:absolute;
   color:#ff2d75;
   animation:float 6s linear infinite;
}

@keyframes float{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-100vh);
opacity:0;
}

}

.star{position:fixed;width:2px;height:2px;background:white;border-radius:50%;animation:twinkle 2s infinite alternate;}
@keyframes twinkle{from{opacity:.2;transform:scale(1);}to{opacity:1;transform:scale(2);}}
.firework{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;}

</style>
</head>

<body>
<audio id="bgMusic" loop>
<source src="your-song.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>❤️ Just For You ❤️</h1>

<div class="message" id="message">
I wanted to tell you something...
</div>

<button onclick="nextMessage()">Next ❤️</button>

</div>

<script>


const messages=[

`Hi Love! ❤️`,

`I hope you find this well and happy! 😊`,

`I know these past few days have been off from my side. 😔`,

`But I want you to know that as much as I like writing 
and expressing myself,
I'm not as much of a good speaker 
when it comes to speaking my emotions. 😞

I have always suppressed most of the deep ones. `,

`I just cannot do it over text because most of the time 
I later realise that I might've missed something
or maybe something I said was misunderstood 
and that is on me for lacking emotional speaking skills.
But I cannot even do anything about it 
because the other person already feels bad 
and might not want to talk about anything! 💔`,

`The stories I posted today were for you to understand 
what my life had been
because you were talking about following a passion
and I don't know how else to tell you that
because I just cannot express myself properly 
on text. Or maybe at all! ☹️😓😢

They were not posted for any other reason. 😕`,

`I'm just saying that I'm trying my best with 
whatever that has been going on. 😖`,

`When I said I want to enjoy my life as well it was
because I always have a fear it might not last long
and I should do all I can until I have the chance to do so. 😣

But I know you are right to ask me to focus on my career as well
and I have not been neglecting it, trust me! 😫`,

`I never meant to send those posts to you
but when you said take the efforts and send them to you 
I really did not think twice,
which I should have thought over properly, 
you were clearly upset with me that time
which I realised later and 
you did not literally ask me to do it. 😖💔,

I never want to put blame on anybody.
I'm soo sorry for making you feel that way! 😣`,

`Why I was asking you to say things directly, 
if you like something I do or about me
or even if you dislike it 
because I can always end up thinking different. 🥲

Some things like you like me with makeup as well,
which I just recently got to know,
I always thought you didn't like it 
as I remember you saying 
I don't have to put it on when I come see you.
But you said that day that you just didn't 
want me going through so much thaam-jhaam.
Whereas, I always thought you didn't like makeup at all.
And because I love to experiment with it 
I felt a little sad that I won't be able to show it to you. 😔`,


`These past few months have been nothing but a fairy-tale for me!
I've loved each and every moment spent with you! ❤️❤️❤️😍🥰😘🤩`,

`I want to say that you're a person 
whom I look up to the most in my life!
You have so much persistance in you! 
I've never seen someone like you! 🤩😳`,

`And I always wonder how you can be so strong 
as well as be free to show your weak side to me! ❤️❤️❤️`,

`I can never have that much courage in me 
and I want to learn that from you! 🧐🤯❤️
And I adore those things in you! 🤩😍❤️`,

`I love your eyes, your hair, your nose, your lips, 
your little dimples when you smile! 😍🥰❤️

Your laugh! 
Your laugh can make me fall for you over and over again! 😳😍😘❤️ 
I want you to always laugh! 😤😘`,

`I know I'm a little stuck in my career right now,
but I promise I've been trying to figure it out 
for a while now and I'm sure I will find my calling soon! 😖🥺`,

`I've never done this or confessed my love to anyone myself in my life 
or any other of my deep feelings
so please forgive me if I say something wrong and ask me 
if you find it that way so that I can explain it to you what I meant.
I'm not good at expressing a lot of things and 
because I can never have hard feelings for you, ever! 
And I want you to know that! 🥺😟`,

`I would never want to burden you with my traumas, 
it is not healthy and I do not want to do that.
I know I am the only one that can handle them 
and I have long before realised that.
So you don't really have to worry about that at all! 😓`,

`Please can we get back to talking normally? 
I really really miss you sooo much! 😣😖😫😩😔😭😢`,

`Text me please love! ❤️`,

`I created this before you called me last night 
which is why it talks about posting stories 'today'. 
And I felt soo relieved you cannot even imagine! 😣
You made me feel soo much better! 🥺`,



];

const music=document.getElementById('bgMusic');
let musicStarted=false;

for(let s=0;s<200;s++){let star=document.createElement('div');star.className='star';star.style.left=Math.random()*100+'vw';star.style.top=Math.random()*100+'vh';star.style.animationDelay=Math.random()*2+'s';document.body.appendChild(star);}

function fireworks(){for(let i=0;i<40;i++){let f=document.createElement('div');f.className='firework';f.style.left='50%';f.style.top='50%';f.style.background=`hsl(${Math.random()*360},100%,60%)`;document.body.appendChild(f);let a=Math.random()*Math.PI*2;let d=100+Math.random()*200;f.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],{duration:1800});setTimeout(()=>f.remove(),1800);}}

let i=0;

function nextMessage(){

if(!musicStarted){
    music.play();
    musicStarted = true;
}

i++;

if(i<messages.length){

document.getElementById("message").innerHTML=messages[i];

}
else{

fireworks();

document.querySelector(".container").innerHTML = `
<h1 style="font-size:70px;">❤️</h1>

<h2 style="color:#ff2d75;font-size:45px;">
I love you babe!😘😍🥰🥺
</h2>

<p style="font-size:40px;">
❤️❤️❤️
</p>

<p style="margin-top:25px;font-size:20px;">
Opening WhatsApp...
</p>
`;

setTimeout(() => {

    const message = encodeURIComponent(
        "I finished reading everything ❤️"
    );

    window.location.href = `https://wa.me/919763568011?text=${message}`;

}, 5000);

}

setInterval(function(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*20)+"px";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

},300);

}


</script>

</body>
</html>
